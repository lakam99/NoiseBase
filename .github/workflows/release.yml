name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noisebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $archive = Join-Path $tools 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') {throw 'Scanner checksum mismatch.'}
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $tools >> $env:GITHUB_PATH
      - name: Scan source and reachable history
        shell: pwsh
        run: |
          ./scripts/Check-Publication.ps1
          gitleaks git . --log-opts=--all --ignore-gitleaks-allow --redact=100 --no-banner
          if ($LASTEXITCODE -ne 0) {throw 'History secret scan failed.'}
      - name: Build Windows x64 VST3 and standalone
        shell: pwsh
        run: ./Build-source.ps1
      - name: Verify audio engine and native workflows
        shell: pwsh
        run: ./scripts/Test-Release.ps1
      - name: Package release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            python scripts/Package-Release.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/Package-Release.py
          }
          if ($LASTEXITCODE -ne 0) {throw 'Packaging failed.'}
      - name: Test installer, rollback, and update validation
        shell: powershell
        run: ./scripts/Test-Updates.ps1 -PackageRoot ./dist/NoiseBase
      - name: Scan packages and nested source archives
        shell: pwsh
        run: ./scripts/Check-Publication.ps1 -Artifacts ./dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoiseBase-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NoiseBase-Windows-x64
          path: release-assets
      - name: Upload, verify, and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/Publish-Release.py --tag "$RELEASE_TAG" --directory release-assets
